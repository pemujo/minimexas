{% load static %}
<!-- Reusable Site Footer -->
<footer class="site-footer mt-auto py-4 border-top border-dark-subtle">
    <div class="container">
        <div class="row align-items-center justify-content-between g-3">
            <!-- Brand Column -->
            <div class="col-md-8">
                <div class="d-flex align-items-center mb-2">
                    <img src="{% static 'images/minimexitas_logo.png' %}" alt="MiniMexitas Logo" class="footer-logo me-2">
                    <span class="fs-5 fw-bold text-white">MiniMexitas <span class="fw-normal text-white-50 fs-6">Community Portal</span></span>
                </div>
                <p class="text-white-50 small mb-2" style="max-width: 540px; line-height: 1.6;">
                    Connecting, empowering, and celebrating our local Bay Area community through trusted member recommendations, family meetups, and shared resources.
                </p>
                <div class="d-flex align-items-center">
                    <span class="badge rounded-pill bg-white bg-opacity-10 text-white-50 px-3 py-1 fw-normal border border-white border-opacity-10">
                        <i class="bi bi-shield-lock-fill text-success me-1"></i> Private WhatsApp Member Portal
                    </span>
                </div>
            </div>

            <!-- Back to Top -->
            <div class="col-md-4 text-md-end text-start mt-3 mt-md-0">
                <a href="#top" class="footer-link-subtle" title="Back to top">
                    <i class="bi bi-arrow-up-circle me-1"></i> Back to top
                </a>
            </div>
        </div>
    </div>
</footer>
