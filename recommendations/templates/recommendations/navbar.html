<!-- recommendations/templates/recommendations/navbar.html -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-whatsapp sticky-top mb-0">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="{% url 'home' %}">
            <div class="brand-icon-box me-2">
                <i class="bi bi-people-fill"></i>
            </div>
            <span>MiniMexas <span class="fw-normal text-white-50 fs-6 ms-1">Portal</span></span>
        </a>
        
        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-1 mt-2 mt-lg-0">
                <li class="nav-item">
                    <a class="nav-link {% if active_page == 'home' %}active{% endif %}" href="{% url 'home' %}">
                        <i class="bi bi-house-door me-1"></i> Home
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_page == 'recommendations' %}active{% endif %}" href="{% url 'recommendations:notes_list' %}">
                        <i class="bi bi-chat-heart me-1"></i> Recommendations
                    </a>
                </li>
                {% if request.session.is_verified_member %}
                <li class="nav-item ms-lg-3 mt-2 mt-lg-0 d-flex align-items-center gap-2">
                    <div class="user-badge-pill d-flex align-items-center">
                        <span class="pulse-dot me-2"></span>
                        <i class="bi bi-person-circle me-1" style="color: #60a5fa;"></i>
                        <span>{{ request.session.member_name|default:"Member" }}</span>
                    </div>
                    <a class="btn btn-signout" href="{% url 'logout' %}" title="Sign out of portal">
                        <i class="bi bi-box-arrow-right me-1"></i> Sign Out
                    </a>
                </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
