name: Django CI & Test Suite

on:
  push:
    branches: [ Development, main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Django System & Config Check
      env:
        SECRET_KEY: 'ci-system-check-secret-key-temporary'
        DEBUG: 'True'
        ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'
      run: |
        python manage.py check

    - name: Check for Uncreated Model Migrations
      env:
        SECRET_KEY: 'ci-migrations-check-secret-key-temporary'
        DEBUG: 'True'
        ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'
      run: |
        python manage.py makemigrations --check --dry-run

    - name: Verify Static Files Collection
      env:
        SECRET_KEY: 'ci-static-check-secret-key-temporary'
        DEBUG: 'True'
        ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'
      run: |
        python manage.py collectstatic --noinput --dry-run

    - name: Run Full Test Suite (147 Functional & Integration Tests)
      env:
        SECRET_KEY: 'ci-test-suite-secret-key-temporary'
        DEBUG: 'True'
        ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'
        GOOGLE_SHEET_KEY: 'mock_test_sheet_key_ci_123'
      run: |
        python manage.py test recommendations --verbosity=2
